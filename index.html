<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عاصمتي | Asimti</title>
  <meta name="description" content="asimti.iq">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1f4e79;
      --bg: #f5f7fa;
      --text: #1d2733;
      --muted: #5b6b7c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }
    .brand { font-weight: 700; font-size: 1.25rem; color: var(--primary); }
    .lang-btn {
      background: none;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    .lang-btn:hover { background: var(--primary); color: #fff; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1rem;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); color: var(--primary); }
    p { color: var(--muted); font-size: 1.15rem; max-width: 36rem; line-height: 1.8; }
    footer { text-align: center; padding: 1.5rem; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <span class="brand" data-i18n="brand">عاصمتي</span>
    <button class="lang-btn" id="langToggle" type="button">English</button>
  </header>

  <main>
    <h1 data-i18n="title">عاصمتي</h1>
    <p data-i18n="subtitle">الموقع قيد الإنشاء. ترقبوا الإطلاق قريباً.</p>
  </main>

  <footer>
    <span>&copy; <span id="year"></span> asimti.iq — </span><span data-i18n="rights">جميع الحقوق محفوظة</span>
  </footer>

  <script>
    const t = {
      ar: { brand: "عاصمتي", title: "عاصمتي", subtitle: "الموقع قيد الإنشاء. ترقبوا الإطلاق قريباً.", rights: "جميع الحقوق محفوظة", toggle: "English" },
      en: { brand: "Asimti", title: "Asimti", subtitle: "Our website is under construction. Launching soon.", rights: "All rights reserved", toggle: "العربية" }
    };
    function setLang(lang) {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[lang][el.dataset.i18n]);
      document.getElementById("langToggle").textContent = t[lang].toggle;
      localStorage.setItem("lang", lang);
    }
    document.getElementById("langToggle").addEventListener("click", () =>
      setLang(document.documentElement.lang === "ar" ? "en" : "ar"));
    document.getElementById("year").textContent = new Date().getFullYear();
    setLang(localStorage.getItem("lang") || "ar");
  </script>
</body>
</html>
